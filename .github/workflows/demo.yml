name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{steps.publish.outputs.script-file}} #el nombre dentro del step tiene que ser el mismo del output here
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
        
      - name: publish JS filename
        id: publish #-> el id puede ser realmente lo que sea
        run: find dist/assests/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'
        
            
      - name: artifacts upload
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: get build artifacts
        uses: actions/download-artifact@v8
        with: 
          name: dist-files
      - name: output contents
        run: ls
      - name: Deploy
        run: echo "Deploying..."
